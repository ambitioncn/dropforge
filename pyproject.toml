[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dropforge"
version = "0.2.0"
description = "Open-source, multi-store drop monitoring with safe checkout handoff"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "DropForge contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
dropforge = "dropforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

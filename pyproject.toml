[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropforge"
version = "0.1.0"
description = "Open-source, multi-store drop monitoring with safe checkout handoff"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DropForge contributors"}]
dependencies = []

[project.scripts]
dropforge = "dropforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

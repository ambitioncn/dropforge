[service]
state_path = "../.dropforge/state.db"
max_concurrency = 8
request_timeout_seconds = 12
user_agent = "DropForge/0.1 (operator@example.com)"
browser_profile = "openclaw"
browser_timeout_seconds = 30
error_confirmations = 3
# Optional protected-secret reference; the webhook URL itself does not belong in TOML.
# feishu_webhook_env = "DROP_FORGE_FEISHU_WEBHOOK"
# feishu_timeout_seconds = 10
dashboard_host = "127.0.0.1"
dashboard_port = 8765

[[drops]]
id = "travis-varsity-crewneck"
adapter = "shopify_browser"
store = "https://shop.travisscott.com"
query = "cactus court varsity crewneck"
interval_seconds = 15

[drops.match]
title = "CJ X NIKE CACTUS COURT VARSITY CREWNECK"
sizes = ["L"]
max_unit_price_cents = 15000

[[drops]]
id = "example-shoe"
adapter = "shopify"
store = "https://example.myshopify.com"
query = "example shoe"
interval_seconds = 20
enabled = false

[drops.match]
title_contains = ["example", "shoe"]
sizes = ["US 9", "US 9.5"]
max_unit_price_cents = 25000

[[drops]]
id = "example-sfcc-category"
adapter = "sfcc_category"
store = "https://www.chromehearts.com/socks"
query = "official online catalog"
interval_seconds = 60
enabled = false

[drops.match]
all_products = true
